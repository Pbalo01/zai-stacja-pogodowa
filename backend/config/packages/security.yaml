security:
    password_hashers:
        # Jawnie argon2id – funkcja przeznaczona do haseł (T5.1)
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # Brak uwierzytelnienia → 401 jako Problem Details (zamiast przekierowania)
            entry_point: App\Security\ProblemEntryPoint
            # POST /api/auth/login z JSON {username, password}
            json_login:
                check_path: api_auth_login
                username_path: username
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\AuthenticationFailureHandler
            # Authorization: Bearer <token>
            access_token:
                token_handler: App\Security\AccessTokenHandler
                failure_handler: App\Security\AuthenticationFailureHandler

    # access_control działa przed walidacją treści (bez tokenu zawsze 401);
    # kontrolery mają dodatkowo #[IsGranted('ROLE_ADMIN')]. Odczyt serii i wyników
    # jest publiczny, a POST /api/measurements uwierzytelnia czujnik kluczem
    # X-API-Key (SensorApiKeyValueResolver).
    access_control:
        - { path: ^/api/series, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api/sensors, roles: ROLE_ADMIN }
        - { path: ^/api/auth/(logout|password)$, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # W testach minimalny koszt argon2id, żeby testy działały szybko
            App\Entity\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
